[tools]
node = "22"

[tasks."check:fast"]
description = "Seconds: fail on internal markers in posts and templates. Offline, read-only."
run = "node scripts/check-content-markers.mjs"

[tasks.check]
description = "Offline lane: markers, production build, SEO essentials in the built output."
depends = ["check:fast"]
run = ["npm ci", "npm run build", "npm run verify:seo"]
