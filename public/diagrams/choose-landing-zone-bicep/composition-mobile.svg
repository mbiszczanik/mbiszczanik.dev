<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 568" role="img" aria-labelledby="t"><title id="t">AVM components and ownership</title><style>.ink{fill:#14130f}.meta{fill:#656056}.acc{fill:#1d4ed8}.box{fill:none;stroke:#656056}.band{fill:#dde6f2}text{font-family:system-ui,sans-serif;font-size:14px}.h{font-weight:600}.date{font-family:ui-monospace,Consolas,monospace;font-size:13px}@media(prefers-color-scheme:dark){.ink{fill:#fff}.meta{fill:#a6a6ab}.acc{fill:#60a5fa}.box{stroke:#85858c}.band{fill:#0d1426}}</style><text class="h acc" x="16" y="24">Supported configuration first</text><rect class="box" x="16" y="44" width="328" height="96"/><text class="h ink" x="28" y="70">Governance</text><text class="ink" x="28" y="96">Management groups, policies, assignments</text><text class="ink" x="28" y="118">Test hierarchy requirements.</text><rect class="box" x="16" y="154" width="328" height="96"/><text class="h ink" x="28" y="180">Management</text><text class="ink" x="28" y="206">Logging and automation</text><text class="ink" x="28" y="228">Choose required components.</text><rect class="box" x="16" y="264" width="328" height="96"/><text class="h ink" x="28" y="290">Connectivity</text><text class="ink" x="28" y="316">Hub networking or Virtual WAN</text><text class="ink" x="28" y="338">Review resource settings.</text><rect class="band" x="16" y="380" width="328" height="138"/><text class="h acc" x="28" y="406">Documented delivery model</text><text class="ink" x="28" y="432">Deployment Stacks;</text><text class="ink" x="28" y="454">standard deployment what-if for preview.</text><text class="ink" x="28" y="476">Your team owns upgrades, removal</text><text class="ink" x="28" y="498">review and failure recovery.</text><text class="meta" x="16" y="550">Sources reviewed 30 Oct 2026.</text></svg>
