<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 680" role="img" aria-labelledby="t"><title id="t">Choosing a Bicep landing zone foundation</title><style>.ink{fill:#14130f}.meta{fill:#656056}.acc{fill:#1d4ed8}.box{fill:none;stroke:#656056}.band{fill:#dde6f2}text{font-family:system-ui,sans-serif;font-size:14px}.h{font-weight:600}.date{font-family:ui-monospace,Consolas,monospace;font-size:13px}@media(prefers-color-scheme:dark){.ink{fill:#fff}.meta{fill:#a6a6ab}.acc{fill:#60a5fa}.box{stroke:#85858c}.band{fill:#0d1426}}</style><text class="h ink" x="16" y="24">Choosing a Bicep landing zone</text><rect class="box" x="16" y="44" width="328" height="130"/><text class="h acc" x="28" y="70">Already on Classic?</text><text class="ink" x="28" y="96">Assess and rehearse migration.</text><text class="ink" x="28" y="118">Align identifiers; plan policy continuity,</text><text class="ink" x="28" y="140">rollback and networking work.</text><text class="ink" x="28" y="162">Support endpoint: 16 Feb 2027.</text><rect class="box" x="16" y="194" width="328" height="108"/><text class="h acc" x="28" y="220">Building a new platform?</text><text class="ink" x="28" y="246">Test supported AVM configuration.</text><text class="ink" x="28" y="268">Different defaults alone do not</text><text class="ink" x="28" y="290">establish a need for custom orchestration.</text><rect class="box" x="16" y="322" width="328" height="86"/><text class="h acc" x="28" y="348">Requirements met?</text><text class="ink" x="28" y="374">Start with the AVM accelerator.</text><text class="ink" x="28" y="396">Name the upgrade and removal owner.</text><rect class="box" x="16" y="430" width="328" height="130"/><text class="h acc" x="28" y="456">A requirement remains unmet?</text><text class="ink" x="28" y="482">Document the gap, then consider</text><text class="ink" x="28" y="504">bounded custom composition.</text><text class="ink" x="28" y="526">Accept orchestration and policy</text><text class="ink" x="28" y="548">maintenance explicitly.</text><text class="ink" x="16" y="596">Classic-first for new work needs</text><text class="ink" x="16" y="618">an exception owner and an exit plan.</text><text class="meta" x="16" y="662">Sources reviewed 29 Oct 2026.</text></svg>
