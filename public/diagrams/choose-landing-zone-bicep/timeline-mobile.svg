<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-labelledby="t"><title id="t">Classic ALZ-Bicep support milestones</title><style>.ink{fill:#14130f}.meta{fill:#656056}.acc{fill:#1d4ed8}.box{fill:none;stroke:#656056}.band{fill:#dde6f2}text{font-family:system-ui,sans-serif;font-size:14px}.h{font-weight:600}.date{font-family:ui-monospace,Consolas,monospace;font-size:13px}@media(prefers-color-scheme:dark){.ink{fill:#fff}.meta{fill:#a6a6ab}.acc{fill:#60a5fa}.box{stroke:#85858c}.band{fill:#0d1426}}</style><text class="h ink" x="16" y="24">Classic ALZ-Bicep support milestones</text><circle class="acc" cx="25" cy="65" r="5"/><text class="date acc" x="44" y="70">24 NOV 2025</text><text class="ink" x="44" y="98">AVM recommended for new deployments</text><text class="ink" x="44" y="120">in accelerator release notes</text><circle class="acc" cx="25" cy="175" r="5"/><text class="date acc" x="44" y="180">16 FEB 2026</text><text class="ink" x="44" y="208">Classic starter removed</text><text class="ink" x="44" y="230">from the accelerator</text><circle class="acc" cx="25" cy="285" r="5"/><text class="date acc" x="44" y="290">29 OCT 2026</text><text class="ink" x="44" y="318">Sources reviewed for this article</text><circle class="acc" cx="25" cy="395" r="5"/><text class="date acc" x="44" y="400">16 FEB 2027</text><text class="ink" x="44" y="428">Classic support ends;</text><text class="ink" x="44" y="450">repository archived</text><rect class="band" x="16" y="482" width="328" height="84"/><text class="ink" x="28" y="508">Between removal and support end:</text><text class="ink" x="28" y="530">bug, security and policy fixes only.</text><text class="meta" x="16" y="600">The support deadline does not</text><text class="meta" x="16" y="622">delete deployed Azure resources.</text></svg>
