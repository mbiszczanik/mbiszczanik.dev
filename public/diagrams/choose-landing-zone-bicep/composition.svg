<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="t d">
  <title id="t">AVM platform landing zone: components and ownership</title>
  <desc id="d">The supported accelerator provides configurable governance, management and connectivity. Governance covers management groups and policy; management covers logging and automation; connectivity includes hub networking or Virtual WAN. The documented delivery pipeline uses Deployment Stacks and standard deployment what-if for preview. The adopting team owns upgrade approval, removal review and failure recovery. Test supported configuration before taking ownership of custom orchestration.</desc>
  <style>
    .ink{fill:#14130f}.meta{fill:#656056}.acc{fill:#1d4ed8}.box{fill:none;stroke:#14130f}.band{fill:#dde6f2}
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px}.h{font-size:16px;font-weight:600}.label{font-family:ui-monospace,Consolas,monospace;font-size:12px}
    @media(prefers-color-scheme:dark){.ink{fill:#fff}.meta{fill:#a6a6ab}.acc{fill:#60a5fa}.box{stroke:#85858c}.band{fill:#0d1426}}
  </style>
  <text class="label acc" x="24" y="30">SUPPORTED CONFIGURATION FIRST</text>
  <rect class="box" x="24" y="48" width="224" height="148"/>
  <text class="h ink" x="40" y="78">Governance</text>
  <text class="ink" x="40" y="109">Management groups</text>
  <text class="ink" x="40" y="132">Policies and assignments</text>
  <text class="meta" x="40" y="168">Test hierarchy requirements</text>
  <rect class="box" x="268" y="48" width="224" height="148"/>
  <text class="h ink" x="284" y="78">Management</text>
  <text class="ink" x="284" y="109">Logging</text>
  <text class="ink" x="284" y="132">Automation</text>
  <text class="meta" x="284" y="168">Choose required components</text>
  <rect class="box" x="512" y="48" width="224" height="148"/>
  <text class="h ink" x="528" y="78">Connectivity</text>
  <text class="ink" x="528" y="109">Hub networking</text>
  <text class="ink" x="528" y="132">or Virtual WAN</text>
  <text class="meta" x="528" y="168">Review resource settings</text>
  <rect class="band" x="24" y="220" width="712" height="110"/>
  <text class="label acc" x="40" y="245">DOCUMENTED DELIVERY MODEL</text>
  <text class="ink" x="40" y="270">Deployment Stacks; standard deployment what-if for preview.</text>
  <text class="ink" x="40" y="295">Your team owns upgrades, removal review and failure recovery.</text>
  <text class="meta" x="24" y="357">Sources reviewed 29 Oct 2026.</text>
</svg>
