<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<!-- Brand "Druk": sky-to-paper page with an accent dash over two lines of text. -->
	<defs>
		<linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#dde6f2" />
			<stop offset="1" stop-color="#f2efe9" />
		</linearGradient>
	</defs>
	<rect width="32" height="32" fill="url(#page)" />
	<rect x="6" y="8" width="10" height="3" fill="#1d4ed8" />
	<rect x="6" y="15" width="20" height="3" fill="#14130f" />
	<rect x="6" y="21" width="14" height="3" fill="#14130f" />
</svg>
